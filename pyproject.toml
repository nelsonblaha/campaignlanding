[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaignlanding"
version = "0.4.0"
description = "A bilingual landing page for pitching an idea in public, with a signup list you own."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nelson Blaha" }]
keywords = ["landing-page", "campaign", "bilingual", "flask", "nonprofit"]
classifiers = [
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = ["Flask>=3.0"]

[project.urls]
Homepage = "https://github.com/nelsonblaha/campaignlanding"
Source = "https://github.com/nelsonblaha/campaignlanding"

[tool.setuptools]
packages = ["campaignlanding"]

[tool.setuptools.package-data]
campaignlanding = ["static/*"]
